name: crowded hall
description: >
  Four people pacing circular routes across a hall the drone has to cross.
  Nobody is trying to avoid anybody: the walkers follow their scripts whatever
  the drone does, which is the honest version of a moving hazard. A drone that
  gets through has either planned around them or been lucky, and running several
  seeds is what tells the two apart.

sim:
  realtime: false
  seed: 12
  dt: 0.005

world:
  name: hall
  bounds_lower: [-5.0, -3.0, 0.0]
  bounds_upper: [5.0, 3.0, 3.0]
  obstacles:
    # Head height, so the drone can climb over them if it thinks to.
    - type: cylinder
      name: walker_a
      center_xy: [-2.0, 0.0]
      radius: 0.28
      z_min: 0.0
      z_max: 1.75
      rgba: [0.62, 0.42, 0.38, 1.0]
      motion: {type: orbit, center: [-2.0, 0.0], radius: 1.2, period: 9.0, height: 0.875}
    - type: cylinder
      name: walker_b
      center_xy: [0.5, 1.0]
      radius: 0.28
      z_min: 0.0
      z_max: 1.75
      rgba: [0.62, 0.42, 0.38, 1.0]
      motion: {type: orbit, center: [0.5, 1.0], radius: 1.0, period: 7.0, height: 0.875}
    - type: cylinder
      name: walker_c
      center_xy: [2.5, -0.8]
      radius: 0.28
      z_min: 0.0
      z_max: 1.75
      rgba: [0.62, 0.42, 0.38, 1.0]
      motion: {type: orbit, center: [2.5, -0.8], radius: 1.3, period: 11.0, height: 0.875}
    # A trolley on a straight there-and-back run, rather than a circle.
    - type: box
      name: trolley
      lower: [-0.4, -2.4, 0.0]
      upper: [0.4, -1.8, 0.9]
      rgba: [0.35, 0.45, 0.55, 1.0]
      motion:
        type: waypoints
        points: [[-3.5, -2.1, 0.45], [3.5, -2.1, 0.45]]
        times: [0.0, 14.0]
        loop: true
    # A stack of empty crates. These have mass: clip one and it goes over.
    - type: box
      name: crate_low
      lower: [4.0, 2.0, 0.0]
      upper: [4.5, 2.5, 0.4]
      mass: 1.2
      rgba: [0.58, 0.48, 0.30, 1.0]
      motion: dynamic
    - type: box
      name: crate_high
      lower: [4.05, 2.05, 0.4]
      upper: [4.45, 2.45, 0.75]
      mass: 0.6
      rgba: [0.58, 0.48, 0.30, 1.0]
      motion: dynamic
  wind:
    type: turbulent
    mean: [0.2, 0.0, 0.0]
    sigma: 0.35
    theta: 0.7

drones:
  - {name: tello-1, start: [-4.2, 0.0, 0.0]}

script:
  - all: takeoff
  - all: "speed 60"
  - {drone: tello-1, cmd: "up 40"}
  - {drone: tello-1, cmd: "forward 250"}
  - wait: 0.5
  - {drone: tello-1, cmd: "forward 250"}
  - wait: 0.5
  - {drone: tello-1, cmd: "go 200 0 -30 50"}
  - all: land

benchmark:
  name: cross the hall without hitting anyone
  goal: [2.8, 0.0, 0.6]
  success_radius: 0.6
  time_limit: 70
