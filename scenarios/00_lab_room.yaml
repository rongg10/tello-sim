name: lab_room
description: >
  A furnished room to fly around in: desks along one wall, a meeting table with
  chairs in the middle, a shelving unit, a structural pillar. Light turbulence,
  the sort a room with people and an air conditioner actually has.

  This is the default world, and it exists because an empty box teaches you
  nothing. Height above the floor and height above whatever is underneath you
  stop being the same number the moment you fly over the table, and a policy
  that treats the downward sensor as altitude will believe it has climbed 75 cm
  in a single tick.

sim:
  realtime: false
  seed: 10

world:
  name: furnished lab
  bounds_lower: [-4.0, -4.0, 0.0]
  bounds_upper: [4.0, 4.0, 2.6]
  obstacles:
    - {type: box, lower: [-3.5, -3.9, 0.0], upper: [1.5, -3.1, 0.75], name: desk run}
    - {type: box, lower: [-0.9, -0.6, 0.0], upper: [0.9, 0.6, 0.74], name: meeting table}
    - {type: box, lower: [3.2, -2.0, 0.0], upper: [3.9, 2.0, 1.8], name: shelving}
    - {type: cylinder, center_xy: [-2.5, 2.2], radius: 0.22, z_min: 0.0, z_max: 2.6, name: pillar}
    - {type: cylinder, center_xy: [-1.45, 0.0], radius: 0.22, z_min: 0.0, z_max: 0.5, name: chair w}
    - {type: cylinder, center_xy: [1.45, 0.0], radius: 0.22, z_min: 0.0, z_max: 0.5, name: chair e}
    - {type: cylinder, center_xy: [0.0, -1.15], radius: 0.22, z_min: 0.0, z_max: 0.5, name: chair s}
    - {type: cylinder, center_xy: [0.0, 1.15], radius: 0.22, z_min: 0.0, z_max: 0.5, name: chair n}
  mission_pads:
    - {pad_id: 1, center: [2.0, -2.0]}
    - {pad_id: 2, center: [-2.6, -1.2]}
  wind:
    type: turbulent
    mean: [0.15, 0.0, 0.0]
    sigma: 0.25
    theta: 0.8

drones:
  - {name: tello-1, start: [-3.2, 3.2, 0.0]}

script:
  - all: takeoff
  - all: "speed 50"
  - all: "up 40"
  # Across the room, passing over the meeting table on the way.
  - {drone: tello-1, cmd: "go 300 -250 0 50"}
  - wait: 1.0
  - {drone: tello-1, cmd: "go 150 -150 -30 40"}
  - wait: 1.0
  - {drone: tello-1, cmd: "cw 180"}
  - {drone: tello-1, cmd: "forward 200"}
  - wait: 1.0
  - all: land
