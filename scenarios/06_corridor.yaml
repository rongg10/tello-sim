name: corridor
description: >
  A corridor with two doorways, 90 cm wide. The drone's cage is 26 cm across, so
  there is about 30 cm of clearance either side: comfortable in still air and
  not comfortable otherwise.

  A cross-draught of 2.6 m/s blows across the FIRST doorway from t=8s to t=20s.
  Most runs clip that doorframe while the draught is blowing. The runs that get
  through show the point of this scenario: they crash into the SECOND doorway,
  in still air, 7 to 11 seconds after the wind has stopped.

  That was not designed in; it came out of the physics. Every command is a
  *relative* move, so once the gust has shoved the drone sideways, nothing ever
  puts it back. It flies the rest of the corridor parallel to where it should
  be, and arrives at a gap it no longer fits through. At the moment of that
  crash there is nothing in the telemetry to react to. Recovering needs an
  absolute position fix, which on real hardware means the mission pad on the
  floor at the corridor's midpoint. It is placed there deliberately, and the
  script deliberately does not use it.

  Doorframes hit over seeds 0 to 19, by draught speed:

      draught   door 1 only   door 2 only   both   neither   SR
      1.8 m/s         0             2          0       18     20/20
      2.2 m/s         1            10          1        8     18/20
      2.6 m/s        13             2          4        1      2/20
      3.0 m/s        19             0          1        0      0/20

  So 2.2 m/s is where the delayed failure is the main one, and 2.6 m/s (the
  setting below) is where the draught alone stops most runs. A graze does not
  always end a run, which is why SR can be high while door 2 is touched.

sim:
  realtime: false
  seed: 6

world:
  name: corridor with two doorways
  bounds_lower: [-7.0, -1.4, 0.0]
  bounds_upper: [7.0, 1.4, 2.4]
  obstacles:
    # First doorway at x = -2.5, leaving a gap of 90 cm.
    - {type: box, lower: [-2.56, -1.4, 0.0], upper: [-2.44, -0.45, 2.4], name: door 1 south}
    - {type: box, lower: [-2.56, 0.45, 0.0], upper: [-2.44, 1.4, 2.4], name: door 1 north}
    # Second doorway at x = +2.5.
    - {type: box, lower: [2.44, -1.4, 0.0], upper: [2.56, -0.45, 2.4], name: door 2 south}
    - {type: box, lower: [2.44, 0.45, 0.0], upper: [2.56, 1.4, 2.4], name: door 2 north}
    - {type: box, lower: [5.0, 0.9, 0.0], upper: [6.8, 1.35, 1.1], name: cabinet}
  mission_pads:
    - {pad_id: 1, center: [0.0, 0.0]}
    - {pad_id: 2, center: [6.0, -0.6]}
  wind:
    type: sum
    fields:
      - {type: turbulent, mean: [0.0, 0.0, 0.0], sigma: 0.2, theta: 0.9}
      - type: transient
        start: 8.0
        duration: 12.0
        rise: 1.0
        field:
          type: wind_tunnel
          velocity: [0.0, -2.6, 0.0]
          lower: [-3.3, -3.0, -1.0]
          upper: [-1.7, 3.0, 3.0]

drones:
  - {name: tello-1, start: [-6.0, 0.0, 0.0]}

script:
  - all: takeoff
  - all: "speed 60"
  - {drone: tello-1, cmd: "forward 200"}
  - wait: 2.0
  # Arrives at the first doorway just as the draught comes up.
  - {drone: tello-1, cmd: "forward 200"}
  - wait: 2.0
  - {drone: tello-1, cmd: "forward 250"}
  - wait: 2.0
  - {drone: tello-1, cmd: "forward 250"}
  - wait: 2.0
  - {drone: tello-1, cmd: "forward 200"}
  - all: land

benchmark:
  name: reach the far end of the corridor
  # Five forward legs of 2 m, 2 m, 2.5 m, 2.5 m and 2 m from x=-6.
  goal: [5.0, 0.0, 0.8]
  success_radius: 0.5
  time_limit: 60
